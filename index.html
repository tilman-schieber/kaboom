<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KABOOM</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
      body.has-touch { flex-direction: column; justify-content: flex-start; padding-top: 8px; gap: 8px; }
      #touch { width: min(100vw, 420px); padding: 0 16px 16px; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
      #touch .row { display: flex; gap: 8px; }
      #touch button {
        flex: 1; height: 56px; font: bold 20px monospace; color: #fcfcfc; background: #222;
        border: 3px solid #bcbcbc; border-radius: 6px; touch-action: none;
      }
      #touch button.on { background: #f83800; }
      #touch button.off { color: #585858; border-color: #585858; }
    </style>
  </head>
  <body>
    <canvas id="screen" width="256" height="224"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
